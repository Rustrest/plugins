name: Validate index

on:
  pull_request:
    paths:
      - index.json
  push:
    branches: [main]
    paths:
      - index.json

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate index.json
        run: bash scripts/validate-index.sh
